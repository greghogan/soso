<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><rect width="900" height="560" fill="#f1f7f7"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#173d49;font-size:23px}.small{font-size:18px}.title{font-size:32px;font-weight:bold}</style><text x="40" y="48" class="title">Follow a change through the ecosystem</text><path d="M0 210Q140 180 310 240T900 235V560H0Z" fill="#a8dce0"/><path d="M0 170L170 115L350 240L0 245Z" fill="#739875"/><text x="36" y="110">Watershed</text><path d="M145 155Q250 150 300 240" fill="none" stroke="#347c9b" stroke-width="20"/><text x="330" y="180">Estuary</text><text x="660" y="190">Reef</text><path d="M590 485L610 350L635 400L660 315L690 430L720 370L740 485Z" fill="#bd895f"/><ellipse cx="440" cy="300" rx="38" ry="17" fill="#346c71"/><path d="M470 300L500 282V318Z" fill="#346c71"/><rect x="30" y="325" width="295" height="175" rx="15" fill="white"/><text x="50" y="360">Runoff can carry</text><text x="50" y="394">sediment and nutrients.</text><text x="50" y="438" class="small">Ask: what changed, where,</text><text x="50" y="468" class="small">and compared with what?</text><rect x="515" y="55" width="350" height="85" rx="12" fill="white"/><text x="535" y="90" class="small">Measure conditions AND organisms.</text><text x="535" y="120" class="small">One observation is not a cause.</text></svg>