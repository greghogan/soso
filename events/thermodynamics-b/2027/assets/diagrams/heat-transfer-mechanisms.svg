<path d="M440 155 Q485 120 480 70" fill="none" stroke="#147d87" stroke-width="3" marker-end="url(#arrow)"/>
<text x="465" y="180" font-size="16">To room:</text><text x="465" y="202" font-size="16">convection</text><text x="465" y="224" font-size="16">+ radiation</text>
